<!DOCTYPE html>
<html>
<head>
    <title>Login and Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Welcome, buddy!</h1>
    <div id="loginDiv" style="display: none;">
        <h2>Login</h2>

        <form id="loginForm">
            <label>Username:</label>
            <input type="text" name="login_username" id="loginUsername" autocomplete="off">

            <br><br>

            <label>Password:</label>
            <div class="password-container">
                <input type="password" name="login_password" id="loginPassword" autocomplete="off">
                <button type="button" class="show-password" onclick="togglePassword('loginPassword', this)">Show</button>
            </div>
            <br><br>

    

            <button type="submit">Login</button>
        </form>
        
        <button id="signup_button">Sign up here </button>
    </div>

    <div id="signupDiv">
        <h2>Sign Up</h2>
        <form id="signupForm"> 
            <label>Username:</label>
            <input type="text" name="signup_username" id="signupUsername" autocomplete="off">

            <br><br>

            <label>Email:</label>
            <input type="email" name="signup_email" id="signupEmail" autocomplete="off"> 

            <br><br>

            <label>Password:</label>
            <div class="password-container">
                <input type="password" name="signup_password" id="signupPassword">
                <button type="button" class="show-password" onclick="togglePassword('signupPassword', this)">Show</button>
            </div>

            <br><br>

            <label>Confirm Password:</label>
            <div class="password-container">
                <input type="password" name="confirm_password" id="confirmPassword">
                <button type="button" class="show-password" onclick="togglePassword('confirmPassword', this)">Show</button>
            </div>

            <br><br>

            <button type="submit">Sign Up</button>
        </form>
        <button id="login_button">Login here</button>
    </div>
    <div id="messageModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Oops!</h2>
            <p id="modalMessage"></p>
            <button type="button" id="modalClose">OK</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
